[package]
name = "ticketprint"
version = "0.1.0"
edition = "2021"
description = "Impresión de tickets en Windows dibujando directo con GDI (y ESC/POS raw opcional), sin PDF ni librerías de impresión de terceros."
repository = "https://github.com/marck2040/ticketprint"
readme = "README.md"
keywords = ["printing", "gdi", "ticket", "escpos", "tauri"]
categories = ["os::windows-apis"]

[dependencies]
serde = { version = "1", features = ["derive"] }
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
serde_json = "1"
